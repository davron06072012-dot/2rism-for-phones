<div style="
  width:320px;
  height:380px;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  border-radius:16px;
  color:white;
  font-family:Arial;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  text-align:center;
  position:relative;
  overflow:hidden;
">

  <!-- Globe -->
  <div style="
    width:140px;
    height:140px;
    margin:20px auto;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #4fc3f7, #0d47a1);
    box-shadow: inset -10px -10px 30px rgba(0,0,0,0.4);
    animation: spin 6s linear infinite;
  "></div>

  <h2 style="margin:10px 0;">🌍 Discover</h2>
  <p style="font-size:14px; opacity:0.8;">
    Explore destinations around the world on a 3D-style globe experience.
  </p>

  <a href="#"
     style="
       display:inline-block;
       margin-top:15px;
       padding:10px 16px;
       background:#1e90ff;
       color:white;
       text-decoration:none;
       border-radius:8px;
       transition:0.3s;
     "
     onmouseover="this.style.transform='scale(1.05)'"
     onmouseout="this.style.transform='scale(1)'"
  >
    Open Globe
  </a>

</div>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
