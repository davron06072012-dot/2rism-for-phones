<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    header {
      background: #1e90ff;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: url('https://i.pravatar.cc/150') center/cover;
      margin: 0 auto 15px;
      border: 3px solid #1e90ff;
    }

    h2 {
      margin: 10px 0 5px;
    }

    p {
      color: #555;
      font-size: 14px;
    }

    .info {
      margin-top: 20px;
      text-align: left;
      background: #f4f7fb;
      padding: 15px;
      border-radius: 10px;
    }

    .info p {
      margin: 8px 0;
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    button:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Account</h1>
  </header>

  <div class="container">

    <div class="avatar"></div>

    <h2>John Traveler</h2>
    <p>Welcome back to your travel account ✈️</p>

    <div class="info">
      <p><strong>Email:</strong> john@example.com</p>
      <p><strong>Trips:</strong> 12 completed</p>
      <p><strong>Favorites:</strong> 5 locations</p>
      <p><strong>Status:</strong> Premium Member</p>
    </div>

    <button>Edit Profile</button>
    <button>My Bookings</button>
    <button>Log Out</button>

  </div>

  <footer>
    © 2026 2rism Travel Website
  </footer>

</body>
</html>
