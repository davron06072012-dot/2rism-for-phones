<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    header {
      background: #1e90ff;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .info {
      text-align: center;
      margin-bottom: 20px;
    }

    .form {
      display: grid;
      gap: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-family: Arial;
    }

    textarea {
      height: 130px;
      resize: none;
    }

    button {
      padding: 12px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 30px;
    }

    .card {
      background: #f4f7fb;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Contact Us</h1>
  </header>

  <div class="container">

    <div class="info">
      <h2>Get in Touch ✈️</h2>
      <p>We are always ready to help you with your travel questions.</p>
    </div>

    <div class="form">
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <input type="text" placeholder="Subject">
      <textarea placeholder="Your Message"></textarea>
      <button>Send Message</button>
    </div>

    <div class="cards">

      <div class="card">
        📍 Address<br>
        123 Travel Street
      </div>

      <div class="card">
        📧 Email<br>
        support@2rism.com
      </div>

      <div class="card">
        📞 Phone<br>
        +1 234 567 890
      </div>

    </div>

  </div>

  <footer>
    © 2026 2rism Travel Website
  </footer>

</body>
</html>
