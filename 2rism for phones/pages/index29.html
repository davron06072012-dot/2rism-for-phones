<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2rism - Travel Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    header {
      background: #1e90ff;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #0f78d1;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      transform: scale(1.1);
    }

    .hero {
      height: 350px;
      background: url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 45px;
      font-weight: bold;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .content {
      text-align: center;
      padding: 40px;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: #1e90ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>2rism</h1>
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Locations</a>
    <a href="#">Activities</a>
    <a href="#">News</a>
    <a href="#">About</a>
  </nav>

  <div class="hero">
    Explore The World
  </div>

  <div class="content">
    <h2>Welcome to 2rism</h2>
    <p>Your travel guide to amazing destinations, activities, and experiences around the world.</p>

    <a href="#" class="btn">Start Exploring</a>
  </div>

  <footer>
    © 2026 2rism Travel Website
  </footer>

</body>
</html>
