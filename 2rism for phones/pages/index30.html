<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partner With Us</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
    }

    header {
      background: #1e90ff;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
    }

    .hero {
      height: 280px;
      background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d') center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      font-weight: bold;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .form {
      display: grid;
      gap: 15px;
      margin-top: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-family: Arial;
    }

    textarea {
      height: 120px;
      resize: none;
    }

    button {
      padding: 12px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #222;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Partner With Us</h1>
  </header>

  <div class="hero">
    Grow Together With 2rism
  </div>

  <div class="container">
    <h2>Become Our Partner</h2>
    <p>
      Join our travel platform and collaborate with us to reach millions of travelers around the world.
    </p>

    <div class="form">
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <input type="text" placeholder="Company Name">
      <textarea placeholder="Tell us about your partnership idea"></textarea>
      <button>Submit Request</button>
    </div>
  </div>

  <footer>
    © 2026 2rism Travel Website
  </footer>

</body>
</html>
